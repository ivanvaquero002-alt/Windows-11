<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexa web</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #111827;
        --panel: rgba(17, 24, 39, 0.82);
        --text: #edf3ff;
        --muted: #cbd5e1;
        --primary: #7dd3fc;
        --primary-strong: #38bdf8;
        --accent: #a78bfa;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
      }

      .card {
        width: min(560px, calc(100% - 32px));
        padding: 32px 24px;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 2rem;
        font-weight: 800;
        color: transparent;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: #061018;
        font-weight: 800;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 18px 35px rgba(56, 189, 248, 0.35);
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .small {
        margin-top: 18px;
        font-size: 0.85rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div><img class="logo" src="Alexa.png" alt="Alexa Logo" /></div>
      <h1>Alexa web</h1>
      <p>Abriendo tu sesión de Alexa para continuar con el acceso a tu cuenta.</p>
      <a class="btn" href="https://alexa.amazon.com/userProfile?redirectTo=%2FuserProfile" target="_blank" rel="noreferrer">Entrar a Alexa</a>
      <div class="small">Si no se abre, pulsa el botón de arriba.</div>
    </main>

    <script>
    setTimeout(function() {
        window.location.href = "https://alexa.amazon.com/userProfile?redirectTo=%2FuserProfile";
    }, 1); // 10000 milisegundos = 10 segundos
      //window.location.href = "https://alexa.amazon.com/userProfile?redirectTo=%2FuserProfile";
    </script>
  </body>
</html>
